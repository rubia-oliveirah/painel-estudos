```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Estudos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Estudar né 🫠</h1>
        <p>Organize suas matérias com praticidade</p>
    </header>

    <main>

        <section>
            <h2>Adicionar tema</h2>

            <input 
                type="text" 
                id="temaInput" 
                placeholder="Digite uma tema..."
            >

            <button id="adicionarBtn">Adicionar</button>
        </section>

        <section>
            <h2>Meus estudos</h2>

            <ul id="listaEstudos"></ul>
        </section>

        <section>
            <h2>Meu progresso</h2>

            <p id="progresso">0% concluído</p>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
